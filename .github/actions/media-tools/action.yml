name: Install media test tools
description: Install the same pinned tools for native and browser media checks
runs:
  using: composite
  steps:
    - name: Install Linux test tools
      if: runner.os == 'Linux'
      env:
        BENTO4_ZIP: Bento4-SDK-1-6-0-641.x86_64-unknown-linux.zip
        BENTO4_SHA256: d48dc6b164941212e5614237b4d9aeff81d4d111ee8b1508892764078a0870e8
        FFMPEG_ARCHIVE: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz
        FFMPEG_SHA256: 68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends python3 nodejs unzip xz-utils
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
          -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/${FFMPEG_ARCHIVE}"
        printf '%s  %s\n' "$FFMPEG_SHA256" "$RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/ffmpeg"
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
        printf '%s\n' "$RUNNER_TEMP/ffmpeg/${FFMPEG_ARCHIVE%.tar.xz}/bin" >> "$GITHUB_PATH"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
          -o "$RUNNER_TEMP/bento4.zip" \
          "https://www.bok.net/Bento4/binaries/${BENTO4_ZIP}"
        printf '%s  %s\n' "$BENTO4_SHA256" "$RUNNER_TEMP/bento4.zip" | sha256sum --check --strict -
        unzip -q "$RUNNER_TEMP/bento4.zip" -d "$RUNNER_TEMP/bento4"
        printf '%s\n' "$RUNNER_TEMP/bento4/${BENTO4_ZIP%.zip}/bin" >> "$GITHUB_PATH"

    - name: Install macOS test tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install ffmpeg bento4 python@3.13 node@22
        printf '%s\n' "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"
        printf '%s\n' "$(brew --prefix node@22)/bin" >> "$GITHUB_PATH"

    - name: Verify external test tools
      shell: bash
      run: |
        set -euo pipefail
        command -v ffmpeg ffprobe mp4dump python3 node
        python3 --version
        node --version
        ffmpeg -hide_banner -version | sed -n '1p'
        ffprobe -hide_banner -version | sed -n '1p'
        ffmpeg -v error -f lavfi -i testsrc=duration=0.2:size=64x64:rate=5 \
          -pix_fmt yuv420p "$RUNNER_TEMP/smoke.mp4"
        mp4dump --format json "$RUNNER_TEMP/smoke.mp4" > /dev/null

    - name: Install pinned media packager
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            asset=packager-linux-x64
            digest=225a33d1c3523dc1e80ead90b44266a4f545e8dbdb6ac30e553b8a7e4066096d ;;
          macOS-ARM64)
            asset=packager-osx-arm64
            digest=c8a26c3639cf2ebfa542dd9b638a2ea3299090ed9b9485d47179d4aa1fdb96b7 ;;
          macOS-X64)
            asset=packager-osx-x64
            digest=736d24def62d1f4944cc827fec728b830d6c619149ef0e5f9828ee2bd5a73ed7 ;;
          *) exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/media-tools"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
          "https://github.com/shaka-project/shaka-packager/releases/download/v3.8.0/$asset" \
          -o "$RUNNER_TEMP/media-tools/packager"
        python3 - "$RUNNER_TEMP/media-tools/packager" "$digest" <<'PYTHON'
        import hashlib
        from pathlib import Path
        import sys
        if hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest() != sys.argv[2]:
            raise SystemExit("Packager checksum mismatch")
        PYTHON
        chmod +x "$RUNNER_TEMP/media-tools/packager"
        "$RUNNER_TEMP/media-tools/packager" --version
        printf '%s\n' "$RUNNER_TEMP/media-tools" >> "$GITHUB_PATH"
