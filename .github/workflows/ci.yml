name: Core bounded hang diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-hang-diagnostic-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2

jobs:
  core-hang:
    name: Presentations and TS / Linux x86_64 / Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [minimum, stable]
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize evidence and enforce unchanged product source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-hang-evidence"
          test "$(uname -m)" = x86_64
          test "$(git rev-parse 8b1f7981db3688b689af89635aef6bf8a6354f4d^{tree})" = 2de209b0748cd985ab297bc56322d87a067f14ae
          git diff --exit-code 8b1f7981db3688b689af89635aef6bf8a6354f4d HEAD -- crates Cargo.toml Cargo.lock .cargo .github/actions .github/scripts/minimum-rust.py vendor tools
          python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "core-hang-evidence", "setup.json").write_text(json.dumps({"runtime_started":False}))'

      - name: Install unchanged pinned media test tools
        uses: ./.github/actions/media-tools

      - name: Install the selected Rust and diagnostic tools
        env:
          SELECTED_CHANNEL: ${{ matrix.rust }}
        run: |
          set -euo pipefail
          rust_channel="$SELECTED_CHANNEL"
          if [[ "$rust_channel" == minimum ]]; then
            rust_channel="$(python3 .github/scripts/minimum-rust.py)"
            test "$rust_channel" = 1.95.0
          fi
          rustup toolchain install "$rust_channel" --profile minimal --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$rust_channel" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Build only the two unchanged integration targets
        run: |
          set -euo pipefail
          cargo test -p drmr-core --locked --test conversion_presentations --test conversion_ts --no-run --message-format=json > "$RUNNER_TEMP/core-hang-build.jsonl"

      - name: Run both full targets and at most one bounded pair repeat
        timeout-minutes: 10
        env:
          SELECTED_CHANNEL: ${{ matrix.rust }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 575s \
            python3 .github/scripts/diagnose-core-hang.py \
              --build-log "$RUNNER_TEMP/core-hang-build.jsonl" \
              --channel "$SELECTED_CHANNEL" \
              --output "$RUNNER_TEMP/core-hang-evidence"

      - name: Preserve only allowlisted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-hang-${{ matrix.rust }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-hang-evidence/
          if-no-files-found: warn
          retention-days: 7
