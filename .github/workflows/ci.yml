name: SAMPLE-AES bounded diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-aes-diagnostic-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2

jobs:
  sample-aes:
    name: SAMPLE-AES / Linux x86_64 / Rust minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize evidence and enforce unchanged product source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sample-aes-evidence"
          test "$(uname -m)" = x86_64
          test "$(git rev-parse 72726c8a4c40249aafeb31ab08bf1875dd7542ff^{tree})" = 2de209b0748cd985ab297bc56322d87a067f14ae
          git diff --exit-code 72726c8a4c40249aafeb31ab08bf1875dd7542ff HEAD -- crates Cargo.toml Cargo.lock .cargo .github/actions .github/scripts/minimum-rust.py vendor tools
          python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "sample-aes-evidence", "setup.json").write_text(json.dumps({"runtime_started":False}))'

      - name: Install unchanged pinned media test tools
        uses: ./.github/actions/media-tools

      - name: Install the declared minimum Rust and diagnostic tools
        run: |
          set -euo pipefail
          rust_channel="$(python3 .github/scripts/minimum-rust.py)"
          test "$rust_channel" = 1.95.0
          rustup toolchain install "$rust_channel" --profile minimal --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$rust_channel" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Build only the unchanged SAMPLE-AES integration target
        run: |
          set -euo pipefail
          cargo test -p drmr-core --locked --test conversion_sample_aes --no-run --message-format=json > "$RUNNER_TEMP/sample-aes-build.jsonl"

      - name: Run two isolated cases and one four-thread full target
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=8s 590s \
            python3 .github/scripts/diagnose-sample-aes-hang.py \
              --build-log "$RUNNER_TEMP/sample-aes-build.jsonl" \
              --output "$RUNNER_TEMP/sample-aes-evidence"

      - name: Preserve only allowlisted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sample-aes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sample-aes-evidence/
          if-no-files-found: warn
          retention-days: 7
