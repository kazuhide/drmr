name: Desktop native builds

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/scripts/minimum-rust.py'
      - 'tools/build_desktop.py'
      - 'tools/collect_notices.py'
      - 'tools/desktop-licenses/**'
      - 'tools/verify_archive.py'
      - 'tools/verify_backports.py'
      - 'tools/backports/**'
      - 'tools/regressions/**'
      - 'tools/tests/test_build_desktop.py'
      - 'tools/tests/test_verify_archive.py'
      - 'tools/tests/test_ci_inputs.py'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Build / ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    # Include system-package downloads before native builds and archive checks.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        rust: [minimum, stable]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the packaging Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev librsvg2-dev pkg-config

      - name: Install the supported Rust toolchain
        run: |
          rust_channel="${{ matrix.rust }}"
          if [[ "$rust_channel" == minimum ]]; then
            rust_channel="$(python .github/scripts/minimum-rust.py)"
          fi
          rustup toolchain install "$rust_channel" --profile minimal --component clippy,rustfmt --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$rust_channel" >> "$GITHUB_ENV"
          rustup run "$rust_channel" cargo --version
          rustup run "$rust_channel" rustc --version

      - name: Check headless host policy and packaging
        run: |
          cargo test --locked -p drmr-desktop
          python -m unittest discover -s tools/tests -p test_build_desktop.py -v
          python -m unittest discover -s tools/tests -p test_verify_archive.py -v
          python -m unittest discover -s tools/tests -p test_ci_inputs.py -v
          cargo fmt --all -- --check

      - name: Verify the complete publisher source and optimized Linux backport
        if: runner.os == 'Linux'
        run: |
          python tools/verify_backports.py
          cargo test --manifest-path tools/regressions/glib-variant-iter/Cargo.toml --release --locked

      - name: Stage the matching CLI and publisher notices
        run: python tools/build_desktop.py --prepare-only

      - name: Check the native feature with Clippy
        run: cargo clippy --locked -p drmr-desktop --features desktop --all-targets -- -D warnings

      - name: Check all headless native host contracts
        run: cargo test --locked -p drmr-desktop --features desktop

      - name: Build the native host and unsigned bundle
        run: python tools/build_desktop.py --release --bundle

      - name: Verify the completed archive and its native CLI pair
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$CARGO_TARGET_DIR/desktop-bundles/drmr-desktop.zip"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            archive="$CARGO_TARGET_DIR/desktop-bundles/drmr.app.tar.gz"
          else
            archive="$CARGO_TARGET_DIR/desktop-bundles/drmr-desktop.tar.gz"
          fi
          python tools/verify_archive.py verify --kind desktop --target "$target" \
            --archive "$archive" --run-pair-check --report "$RUNNER_TEMP/desktop-archive-verification.json"

      - name: Upload native build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}
          path: |
            target/desktop/desktop-bundles/*.tar.gz
            target/desktop/desktop-bundles/*.zip
            ${{ runner.temp }}/desktop-archive-verification.json
          if-no-files-found: error
          retention-days: 14
