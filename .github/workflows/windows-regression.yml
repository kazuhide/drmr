name: Windows full regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows full regression / ${{ matrix.rust }} / ordinary user
    strategy:
      fail-fast: false
      matrix:
        rust: [minimum, stable]
    runs-on: windows-2022
    # Run every native protection route and round trip as an ordinary user,
    # with room for complete media comparisons before release compilation.
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Python for the real-media harness
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Check vendored source bytes before native compilation
        run: python -W error::ResourceWarning -m unittest discover -s tools/tests -p test_verify_private_fs.py -v

      - name: Check archive owner cleanup with real private Windows ACLs
        run: ./.github/scripts/test-windows-cli-archive-cleanup.ps1

      - name: Install checksummed Windows media tools
        run: ./.github/scripts/install-windows-media-tools.ps1

      - name: Install the supported Rust toolchain
        run: |
          $rustChannel = '${{ matrix.rust }}'
          if ($rustChannel -eq 'minimum') {
            $rustChannel = (& python .github/scripts/minimum-rust.py).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the minimum Rust version' }
          }
          & rustup toolchain install $rustChannel --profile minimal --component clippy,rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          "RUSTUP_TOOLCHAIN=$rustChannel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & rustup run $rustChannel cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo version check failed' }
          & rustup run $rustChannel rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler version check failed' }

      - name: Check product version and changelog consistency
        run: python tools/check_release.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check native platform warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run native manifest lint rules
        run: |
          cargo test -p drmr-manifest --locked -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/manifest-lint-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native manifest lint tests failed' }
          python .github/scripts/check-rust-test-skips.py --scope workspace --log "$env:RUNNER_TEMP/manifest-lint-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native manifest lint tests were incomplete' }

      - name: Check elevated media execution is refused before payload creation
        run: cargo test -p drmr-core --test native media_workspace_checks_default_ownership_before_generating_payloads --locked -- --nocapture

      - name: Test native access controls, descendants and the common CLI as a regular user
        run: ./.github/scripts/windows-native-tests.ps1

      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: windows-native-results-${{ matrix.rust }}
          path: |
            ${{ runner.temp }}/manifest-lint-tests.log
            ${{ runner.temp }}/drmr-native-user/bbb-media-report.json
            ${{ runner.temp }}/drmr-native-user/conversion-report.json
            ${{ runner.temp }}/drmr-native-user/stdout.log
            ${{ runner.temp }}/drmr-native-user/stderr.log
          if-no-files-found: warn
