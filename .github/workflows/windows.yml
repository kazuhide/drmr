name: Windows native contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows / private files and process trees
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Python for the real-media harness
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Install checksummed Windows media tools
        run: ./.github/scripts/install-windows-media-tools.ps1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          cargo --version
          rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check native platform warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check elevated media execution is refused before payload creation
        run: cargo test -p drmr-core --test native media_workspace_checks_default_ownership_before_generating_payloads --locked -- --nocapture

      - name: Test native access controls, descendants, CLI and batch as a regular user
        run: ./.github/scripts/windows-native-tests.ps1

      - name: Build native CLI
        run: cargo build --release --locked -p drmr

      - name: Check native CLI help
        run: .\target\release\drmr.exe --help
