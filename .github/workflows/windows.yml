name: Windows guide ACL proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-guide-acl-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Windows PowerShell 5.1 / actual guide ACLs
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 8

      - name: Bind the diagnostic to the frozen guide source
        run: |
          function Read-GitValue([string]$revision) {
            $value = & git rev-parse $revision
            if ($LASTEXITCODE -ne 0) { throw 'Source identity is unavailable' }
            return $value
          }
          $expectedParent = 'a1498616d4a07aa43da0dd1b9be8221d14865cdf'
          $head = Read-GitValue 'HEAD'
          $tree = Read-GitValue 'HEAD^{tree}'
          $parent = Read-GitValue 'HEAD^'
          if ($head -cne $env:GITHUB_SHA -or $parent -cne $expectedParent) {
            throw 'The diagnostic source does not match the frozen guide candidate'
          }
          $allowed = @('.github/scripts/test-windows-archive-acl-owner.ps1',
            '.github/scripts/windows_archive_acl_owner_worker.py',
            '.github/scripts/windows_archive_acl_research.py',
            '.github/workflows/windows.yml',
            'tools/tests/test_windows_archive_acl_research.py')
          $changed = @(& git diff --name-only $expectedParent HEAD)
          if ($LASTEXITCODE -ne 0 -or
              @(Compare-Object @($changed | Sort-Object) @($allowed | Sort-Object)).Count -ne 0) {
            throw 'The diagnostic changes exceed the approved source allowlist'
          }
          Write-Output ('DRMR_GUIDE_ACL_SOURCE ' + ([ordered]@{
            parent = $parent; head = $head; tree = $tree
          } | ConvertTo-Json -Compress))

      - name: Install pinned Python for the cleanup fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Parse the diagnostic PowerShell scripts
        run: |
          foreach ($file in @('.github/scripts/test-windows-cli-archive-cleanup.ps1', '.github/scripts/windows-cli-archive-cleanup.ps1', '.github/scripts/test-windows-archive-acl-owner.ps1', '.github/scripts/windows-cli-private-acl-tests.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw 'Diagnostic PowerShell syntax check failed' }
          }

      - name: Check the embedded Python observer
        run: python -B -m unittest discover -s tools/tests -p test_windows_archive_cleanup_observer.py

      - name: Check the separate bounded research capture
        run: python -B -m unittest discover -s tools/tests -p test_windows_archive_acl_research.py

      - name: Prove actual guide ACLs under a protected Modify parent
        id: owner
        run: .github/scripts/test-windows-archive-acl-owner.ps1

      - name: Require no classified owner failure
        env:
          CLASSIFIED_FAILURE: ${{ steps.owner.outputs.classified_failure }}
        run: |
          if ($env:CLASSIFIED_FAILURE -cne 'false') {
            throw 'The owner probe reported or omitted its failure classification'
          }

      - name: Preserve all seven ordinary-user cleanup gates
        run: .github/scripts/test-windows-cli-archive-cleanup.ps1
