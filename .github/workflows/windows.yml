name: Windows archive DWORD regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-archive-dword-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Archive DWORD regression / RED then GREEN
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Python for the cleanup fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Parse the diagnostic PowerShell scripts
        run: |
          foreach ($file in @('.github/scripts/test-windows-cli-archive-cleanup.ps1', '.github/scripts/windows-cli-archive-cleanup.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw 'Diagnostic PowerShell syntax check failed' }
          }

      - name: Check the embedded Python observer
        run: python -B -m unittest discover -s tools/tests -p test_windows_archive_cleanup_observer.py

      - name: Prove the old reader fails and the restored reader passes
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $pwd '.github/scripts/test-windows-cli-archive-cleanup.ps1'
          $original = [IO.File]::ReadAllBytes($script)
          $text = [Text.UTF8Encoding]::new($false, $true).GetString($original)
          $needle = '$call.exit_code -gt 4294967295'
          if ([regex]::Matches($text, [regex]::Escape($needle)).Count -ne 1) { throw 'The DWORD regression mutation target is ambiguous' }
          Write-Output ('DRMR_DWORD_SOURCE_SHA256 ' + [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($original)).ToLowerInvariant())
          $before = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Force | Where-Object Name -Like 'drmr-archive-observer-*' | Select-Object -ExpandProperty FullName)
          $redConfirmed = $false
          try {
            [IO.File]::WriteAllText($script, $text.Replace($needle, '$call.exit_code -gt 2147483647'), [Text.UTF8Encoding]::new($false))
            try { & $script } catch {
              if ($_.Exception.Message -ne 'The diagnostic reader changed or refused a valid exit code') { throw 'The RED check failed at an unexpected stage' }
              $redConfirmed = $true
            }
          } finally {
            [IO.File]::WriteAllBytes($script, $original)
          }
          if (-not $redConfirmed) { throw 'The old signed reader did not fail its real regression check' }
          if ([Convert]::ToBase64String([IO.File]::ReadAllBytes($script)) -ne [Convert]::ToBase64String($original)) { throw 'The GREEN source was not restored byte for byte' }
          $after = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Force | Where-Object Name -Like 'drmr-archive-observer-*' | Select-Object -ExpandProperty FullName)
          if ($after.Count -ne $before.Count -or @($after | Where-Object { $_ -notin $before }).Count -ne 0) { throw 'The RED observer directory was not removed' }
          Write-Output 'DRMR_DWORD_RED_CONFIRMED'
          Write-Output 'DRMR_DWORD_RED_OWNED_CLEANUP_CONFIRMED'
          & $script
          $after = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Force | Where-Object Name -Like 'drmr-archive-observer-*' | Select-Object -ExpandProperty FullName)
          if ($after.Count -ne $before.Count -or @($after | Where-Object { $_ -notin $before }).Count -ne 0) { throw 'The GREEN observer directory was not removed' }
          if ([Convert]::ToBase64String([IO.File]::ReadAllBytes($script)) -ne [Convert]::ToBase64String($original)) { throw 'The GREEN check changed its source' }
          Write-Output 'DRMR_DWORD_GREEN_CONFIRMED'
          Write-Output 'DRMR_DWORD_GREEN_OWNED_CLEANUP_CONFIRMED'
