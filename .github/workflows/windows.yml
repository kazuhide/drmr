name: Windows native contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows / private files and process trees
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Python for the real-media harness
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Install checksummed Windows media tools
        run: ./.github/scripts/install-windows-media-tools.ps1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          cargo --version
          rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check native platform warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check elevated media execution is refused before payload creation
        run: cargo test -p drmr-core --test native media_workspace_checks_default_ownership_before_generating_payloads --locked -- --nocapture

      - name: Test native access controls, descendants, CLI and batch as a regular user
        run: ./.github/scripts/windows-native-tests.ps1

      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: windows-native-results
          path: |
            ${{ runner.temp }}/drmr-native-user/bbb-media-report.json
            ${{ runner.temp }}/drmr-native-user/conversion-report.json
            ${{ runner.temp }}/drmr-native-user/stdout.log
            ${{ runner.temp }}/drmr-native-user/stderr.log
          if-no-files-found: warn

      - name: Build native CLI
        run: cargo build --release --locked -p drmr

      - name: Check native CLI help
        run: .\target\release\drmr.exe --help

      - name: Inspect native runtime dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $installation 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'PE dependency inspection tool is unavailable' }
          & $dumpbin.FullName /DEPENDENTS .\target\release\drmr.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime dependency inspection failed' }

      - name: Package native CLI and user documentation
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'drmr-windows-x86_64'
          New-Item -ItemType Directory -Path $archive | Out-Null
          Copy-Item .\target\release\drmr.exe, .\LICENSE, .\README.md $archive
          New-Item -ItemType Directory -Path "$archive\docs" | Out-Null
          Copy-Item .\docs\*.md "$archive\docs"
          Compress-Archive -Path "$archive\*" -DestinationPath "$archive.zip"

      - name: Upload native CLI archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: drmr-windows-x86_64
          path: ${{ runner.temp }}/drmr-windows-x86_64.zip
          if-no-files-found: error
