name: Windows native contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    name: Isolated regular-user path diagnostic
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.12'
      - name: Install identical checksummed media tools
        run: ./.github/scripts/install-windows-media-tools.ps1
      - name: Probe direct media paths as an ordinary user
        run: ./.github/scripts/windows-path-probe.ps1 -Mode direct
