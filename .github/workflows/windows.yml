name: Temporary Windows publication reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Research only / Windows minimum / publication
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.95'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - name: Check out the isolated research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'
      - name: Install checksummed media tools
        uses: ./.github/actions/windows-media-tools
      - name: Install the failing configuration's compiler
        run: rustup toolchain install 1.95 --profile minimal --no-self-update
      - name: Reuse existing compiled dependencies
        uses: ./.github/actions/rust-cache
      - name: Compile one integration target and reproduce as the ordinary user
        run: ./.github/scripts/windows-native-tests.ps1
      - name: Retain research evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-publication-research
          path: |
            ${{ runner.temp }}/drmr-native-user/stdout.log
            ${{ runner.temp }}/drmr-native-user/stderr.log
            ${{ runner.temp }}/drmr-native-user/groups
          if-no-files-found: warn
          retention-days: 3
