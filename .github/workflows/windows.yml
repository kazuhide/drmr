name: Windows owner ACL research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-archive-owner-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Ordinary owner / protected Modify parent
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Install pinned Python for the cleanup fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Parse the diagnostic PowerShell scripts
        run: |
          foreach ($file in @('.github/scripts/test-windows-cli-archive-cleanup.ps1', '.github/scripts/windows-cli-archive-cleanup.ps1', '.github/scripts/test-windows-archive-acl-owner.ps1', '.github/scripts/windows-cli-private-acl-tests.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw 'Diagnostic PowerShell syntax check failed' }
          }

      - name: Check the embedded Python observer
        run: python -B -m unittest discover -s tools/tests -p test_windows_archive_cleanup_observer.py

      - name: Check the separate bounded research capture
        run: python -B -m unittest discover -s tools/tests -p test_windows_archive_acl_research.py

      - name: Prove real PowerShell 5.1 identity transport RED then GREEN
        run: python -B .github/scripts/test_windows_identity_transport.py

      - name: Probe the unchanged ACL helper under a protected Modify parent
        id: owner
        run: .github/scripts/test-windows-archive-acl-owner.ps1

      - name: Preserve the seven ordinary-user cleanup gates when the focused probe is unclassified
        if: steps.owner.outputs.classified_failure != 'true'
        run: .github/scripts/test-windows-cli-archive-cleanup.ps1
