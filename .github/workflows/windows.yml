name: Windows archive ACL diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-archive-acl-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Archive ACL diagnostic / probe ${{ matrix.probe }}
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Python for the cleanup fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'

      - name: Parse the diagnostic PowerShell scripts
        run: |
          foreach ($file in @('.github/scripts/test-windows-cli-archive-cleanup.ps1', '.github/scripts/windows-cli-archive-cleanup.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw 'Diagnostic PowerShell syntax check failed' }
          }

      - name: Run at most five complete fresh-user cleanup iterations
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($iteration in 1..5) {
            & ./.github/scripts/test-windows-cli-archive-cleanup.ps1 -DiagnosticIteration $iteration
            Write-Output ('DRMR_ARCHIVE_ITERATION_COMPLETE ' + $iteration)
          }
