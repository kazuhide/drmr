[workspace]
resolver = "3"
members = ["crates/drmr-core", "crates/drmr", "crates/drmr-server", "crates/drmr-test-support"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/kazuhide/drmr"

[workspace.dependencies]
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = { version = "=0.1.2", features = ["alloc", "zeroize"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
memchr = "2.7"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
regex = "1.11"
roxmltree = "0.21"
rustix = { version = "1.1", features = ["fs", "process", "thread"] }
rusty-s3 = "0.10"
http-body = "1"
include_dir = { version = "0.7", features = ["metadata"] }
indexmap = "2"
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zeroize = "1.8"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal"] }
webpki-roots = "1.0"
zmij = "1.0"

[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
