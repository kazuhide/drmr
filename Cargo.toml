[workspace]
resolver = "3"
exclude = ["vendor/process-wrap", "vendor/glib", "vendor/private-fs"]
members = ["crates/drmr-core", "crates/drmr", "crates/drmr-server", "crates/drmr-test-support", "crates/drmr-desktop", "crates/drmr-manifest"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
repository = "https://github.com/kazuhide/drmr"

[workspace.dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
memchr = "2.8.3"
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex = "1.13.1"
roxmltree = "0.21.1"
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process", "thread"] }
http-body = "1.1.0"
include_dir = { version = "0.7.4", features = ["metadata"] }
indexmap = "2.14.2"
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
zeroize = "1.9.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "signal"] }
webpki-roots = "1.0.10"
zmij = "1.0.23"

[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[patch.crates-io]
process-wrap = { path = "vendor/process-wrap" }
glib = { path = "vendor/glib" }
private-fs = { path = "vendor/private-fs" }
