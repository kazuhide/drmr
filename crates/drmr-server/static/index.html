<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRM Packaging Console</title>
<script>(function(){try{var l=localStorage.getItem('drmr-language');document.documentElement.lang=l==='ja'?'ja':'en';}catch(e){}})();</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip-link" href="#detail" data-i18n="skipToContent">Skip to content</a>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true">DRM</span><span class="brand-name" data-i18n="brandName">DRM Packaging Console</span></div>
  <div class="top-actions">
    <label class="lang"><span class="sr-only" data-i18n="language">Language</span><select id="language-select" aria-label="Language" data-i18n-aria="language"><option value="en" selected>English</option><option value="ja">日本語</option></select></label>
  </div>
</header>
<div id="common-owner" class="notice notice-warn request-recovery" role="status" aria-live="polite" hidden></div>
<div class="console">
  <aside class="list-pane" aria-labelledby="common-sessions-title">
    <section class="common-navigation">
      <button type="button" class="btn btn-primary" id="common-new" data-common-action="new" data-i18n="commonNew">New conversion</button>
      <h2 id="common-sessions-title" data-i18n="commonWorkflows">Conversions and saved plans</h2>
      <ul class="contents" id="common-sessions"></ul>
    </section>
  </aside>
  <main class="detail-pane" id="detail" tabindex="-1">
    <article id="common-workflow" aria-labelledby="common-title" hidden></article>
  </main>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/common-api.js"></script>
<script src="/static/js/common-report.js"></script>
<script src="/static/js/common-state.js"></script>
<script src="/static/js/common-files.js"></script>
<script src="/static/js/common-view.js"></script>
<script src="/static/js/common-console.js"></script>
</body>
</html>
