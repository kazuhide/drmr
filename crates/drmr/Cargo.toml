[package]
name = "drmr"
description = "Command-line tools for inspecting and repackaging encrypted streaming media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "drmr"
path = "src/main.rs"

[dependencies]
clap.workspace = true
drmr-core = { path = "../drmr-core" }
# `drmr serve`: the console server (axum on tokio) lives in drmr-server; drmr-core stays free
# of both.
drmr-server = { path = "../drmr-server" }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
tempfile.workspace = true
drmr-test-support = { path = "../drmr-test-support" }
ureq.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dev-dependencies]
private-fs = "0.2.1"

[lints]
workspace = true
